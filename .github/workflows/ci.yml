name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Stress test (50 random fixtures)
        run: node test/stress.mjs 50

      - name: Upload sample PDFs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-samples
          path: test/samples/
